name: Deploy

# GitHub Pages, not Vercel.
#
# The app runs the whole screening in the browser — the engine is bundled into
# the page — so there is no server to run and nothing personal is ever
# transmitted. That makes a static host not just sufficient but better: no
# server means no server that could log, cache or leak somebody's income.
#
# Deployment is gated on the test suite, deliberately. The suite is what
# enforces the verification and maturity gates, the checks that stop the app
# telling somebody they are entitled to money nobody has confirmed. A deploy
# that can outrun those tests defeats the point of having them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build enforces its own size budget, so a bundle that quietly grows
      # into hundreds of kilobytes fails here. Part of the audience opens this
      # on an old phone on metered data.
      - run: npm run build
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      page_url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy
        id: pages
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # One address, not two. Once a custom domain is set, the github.io URL
      # just redirects to it, so checking both only tested the same site twice.
      # The domain is also the only address a visitor will ever type.
      - name: Check the live site
        env:
          URL: ${{ vars.PRODUCTION_URL || needs.deploy.outputs.page_url }}
        run: |
          if [ -z "$URL" ]; then
            echo "No address to check: neither PRODUCTION_URL nor the Pages URL is set." >&2
            exit 1
          fi

          set +e
          node scripts/smoke-site.mjs "$URL"
          status=$?
          set -e

          # Exit 3 means the site is correct but TLS is not up yet, which is
          # the normal state for the first hours after a domain is attached.
          # Failing the run for that trains people to ignore red builds.
          if [ "$status" -eq 3 ]; then
            {
              echo "### Deployed, but not on HTTPS yet"
              echo
              echo "\`$URL\` serves the right site over plain HTTP and refuses TLS."
              echo "GitHub issues the certificate after it verifies the DNS, which can"
              echo "take several hours."
              echo
              echo "When Settings → Pages offers **Enforce HTTPS**, tick it. This check"
              echo "starts failing for real once the certificate exists and then breaks."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "$status"

      - name: Note that the custom domain was not checked
        if: vars.PRODUCTION_URL == ''
        run: |
          {
            echo "### Custom domain not checked"
            echo
            echo "The repository variable \`PRODUCTION_URL\` is not set, so the check"
            echo "above ran against the Pages URL instead of the real domain. Set it"
            echo "under Settings → Secrets and variables → Actions → Variables."
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy

# GitHub Pages, not Vercel.
#
# The app runs the whole screening in the browser — the engine is bundled into
# the page — so there is no server to run and nothing personal is ever
# transmitted. That makes a static host not just sufficient but better: no
# server means no server that could log, cache or leak somebody's income.
#
# Deployment is gated on the test suite, deliberately. The suite is what
# enforces the verification and maturity gates, the checks that stop the app
# telling somebody they are entitled to money nobody has confirmed. A deploy
# that can outrun those tests defeats the point of having them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build enforces its own size budget, so a bundle that quietly grows
      # into hundreds of kilobytes fails here. Part of the audience opens this
      # on an old phone on metered data.
      - run: npm run build
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy
        id: pages
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Two different claims, so two checks where possible.
      #
      # The Pages URL proves the build that just went out is being served. The
      # production domain proves the DNS and the Pages custom-domain setting
      # actually point at it — either can be wrong while the deployment itself
      # is perfect, and the domain is the only one of the two a visitor will
      # ever type.
      - name: Check the Pages URL
        run: node scripts/smoke-site.mjs "${{ needs.deploy.outputs.page_url || 'https://frantisekjanickovic.github.io/mojedavky/' }}"
        continue-on-error: true

      - name: Check the production domain
        if: vars.PRODUCTION_URL != ''
        run: node scripts/smoke-site.mjs "${{ vars.PRODUCTION_URL }}"

      - name: Warn when the production domain is not configured
        if: vars.PRODUCTION_URL == ''
        run: |
          {
            echo "### Production domain not checked"
            echo
            echo "The repository variable \`PRODUCTION_URL\` is not set, so the"
            echo "custom domain was not verified. Set it under Settings →"
            echo "Secrets and variables → Actions → Variables."
          } >> "$GITHUB_STEP_SUMMARY"
